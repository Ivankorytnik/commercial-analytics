name: Promote TEST to PROD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-test-to-prod.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout TEST source
        uses: actions/checkout@v4
        with:
          repository: Ivankorytnik/commercial-analytic-test
          ref: main
          path: _test_source

      - name: Mirror TEST into PROD
        shell: bash
        run: |
          rsync -a --delete --exclude='.git' --exclude='_test_source' _test_source/ ./
          rm -rf _test_source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PROD already matches TEST"
            exit 0
          fi
          git commit -m "Promote commercial-analytic-test to production"
          git push origin HEAD:main
